bundle:
  name: nimbus

include:
  - databricks/resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for Nimbus Delta tables.
    default: workspace
  schema:
    description: Schema created for Nimbus tables.
    default: nimbus
  warehouse_id:
    description: >-
      Serverless SQL warehouse the app service principal may use. No default:
      pass --var warehouse_id=<id> or set BUNDLE_VAR_warehouse_id.

sync:
  exclude:
    - data/raw
    - data/cache
    - .venv
    - backend/tests
    - docs/screenshots
    - "**/__pycache__"
  # Keep backend/models/ and data/demo/evidence/ in the sync. Do not add them here.

# The workspace host comes from the CLI profile or DATABRICKS_HOST.
# Production mode keeps the app name `nimbus` and the job name
# `nimbus_refresh`. Development mode would prefix both.
targets:
  prod:
    default: true
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
