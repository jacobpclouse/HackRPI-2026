<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DarkWatch case file</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/img/favicon-32.png" sizes="32x32" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link href="/css/tokens.css" rel="stylesheet" />
  <link href="/css/base.css" rel="stylesheet" />
  <link href="/css/components.css" rel="stylesheet" />
  <link href="/css/case.css" rel="stylesheet" />

<body>

    <a href="/" class="wordmark" aria-label="Nimbus">
      <img src="/img/Nimbus_white_text_art.png" alt="NIMBUS" />

    <div class="case-bar-actions">
      <button type="button" id="case-print">Download PDF</button>

  <script src="/js/case.js" type="module"></script>
