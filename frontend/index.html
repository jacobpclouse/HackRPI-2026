<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DarkWatch</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/img/favicon-32.png" sizes="32x32" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>window.CESIUM_BASE_URL = "https://cdn.jsdelivr.net/npm/cesium@1.124/Build/Cesium/";</script>
  <link href="https://cdn.jsdelivr.net/npm/cesium@1.124/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/css/tokens.css" rel="stylesheet" />
  <link href="/css/base.css" rel="stylesheet" />
  <link href="/css/layout.css" rel="stylesheet" />
  <link href="/css/components.css" rel="stylesheet" />
  <link href="/css/globe.css" rel="stylesheet" />
  <link href="/css/analyze.css" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <header>
      <button type="button" id="wordmark" class="wordmark" aria-label="Nimbus">
        <img src="/img/Nimbus_white_text_art.png" alt="NIMBUS" />
      </button>
      <div class="clock-cluster">
        <span id="utc" class="data">00:00:00</span>
        <span id="badge" class="badge live">LIVE</span>
        <span id="offset" class="data muted" hidden></span>
        <button type="button" id="speed" title="Simulation speed">1×</button>
        <button type="button" id="live" hidden>Live</button>
        <span id="status-dot" class="status-dot" title="Data sources"></span>
        <button type="button" id="analyze-open">Analyze imagery</button>
        <a href="/brief.html" id="header-brief">Incident brief <span class="brief-dot" aria-hidden="true"></span></a>
      </div>
    </header>

    <main>
      <div id="cesium"></div>

      <div id="hud">
        <div id="hud-cursor" class="data">—</div>
        <div id="hud-alt" class="data">—</div>
        <div id="hud-tip" class="data" hidden></div>
        <div id="hud-chips"></div>
        <div id="hud-status" hidden></div>
      </div>

      <div id="dock">
        <button type="button" id="place-kattegat">Kattegat</button>
        <button type="button" id="dock-sats" class="on">Satellites</button>
        <button type="button" id="dock-ais" class="on">AIS</button>
        <button type="button" id="dock-global-ais" class="on">Global AIS</button>
        <button type="button" id="dock-ais-only" class="on">AIS-only in scene</button>
        <button type="button" id="dock-radar" class="on">Radar tiles</button>
        <button type="button" id="dock-det" class="on">Detections</button>
        <button type="button" id="dock-model">Classifier</button>
        <button type="button" id="dock-upload" hidden>Upload</button>
      </div>

      <aside id="legend" hidden></aside>

      <aside id="card" hidden>
        <div class="card-head">
          <h2 id="card-title"></h2>
          <button type="button" id="card-close">Close</button>
        </div>
        <div id="card-body"></div>
      </aside>

      <section id="timeline" hidden>
        <div class="timeline-head">
          <strong id="tl-title">Coverage</strong>
          <span id="tl-gap" class="hero-inline"></span>
        </div>
        <canvas id="tl-canvas" height="40"></canvas>
      </section>
    </main>
  </div>

  <div id="analyze" hidden>
    <header class="analyze-head">
      <div>
        <h1>ANALYZE IMAGERY</h1>
        <span class="chip">ResNet-18 · test AP 0.981</span>
        <a href="/brief.html" class="chip">Incident brief</a>
        <p id="analyze-mode" class="hint"></p>
      </div>
      <button type="button" id="analyze-close">BACK TO DARK WATCH</button>
    </header>
    <div class="analyze-body">
      <aside class="analyze-left">
        <form id="analyze-form">
          <label class="dropzone" id="analyze-drop">
            Drop a SAR image
            <span class="micro">JPEG, PNG, or GeoTIFF. Optional VOC XML.</span>
            <input id="analyze-image" type="file" accept=".jpg,.jpeg,.png,.tif,.tiff,image/jpeg,image/png,image/tiff" hidden />
          </label>
          <label class="micro">Optional labels (Pascal VOC XML)
            <input id="analyze-xml" type="file" accept=".xml,text/xml" />
          </label>
          <label class="micro">Acquisition time (ISO, optional)
            <input id="analyze-time" type="text" placeholder="2026-11-02T05:23:46Z" />
          </label>
          <button type="submit" id="analyze-run">Analyze</button>
        </form>
        <h2>Samples</h2>
        <div id="analyze-samples"></div>
      </aside>
      <section class="analyze-center">
        <div id="analyze-viewer">
          <canvas id="analyze-canvas"></canvas>
          <div id="analyze-slider" hidden><div id="analyze-slider-bar"></div></div>
          <div id="analyze-tooltip" hidden></div>
          <div id="analyze-scale" class="data" hidden></div>
        </div>
        <div class="analyze-toggles">
          <label class="micro"><input type="checkbox" id="analyze-show-rejected" /> Show rejected</label>
          <label class="micro"><input type="checkbox" id="analyze-show-labels" checked /> Show labels</label>
          <label class="micro"><input type="checkbox" id="analyze-compare" /> Before / after</label>
        </div>
      </section>
      <aside class="analyze-right">
        <div id="analyze-heroes"></div>
        <div id="analyze-gt"></div>
        <div id="analyze-ais"></div>
        <canvas id="analyze-hist" width="280" height="90"></canvas>
        <div id="analyze-chip-zoom"></div>
        <p id="analyze-model" class="hint"></p>
      </aside>
    </div>
    <div id="analyze-funnel"></div>
    <div class="analyze-table-wrap"><table id="analyze-table"></table></div>
    <footer class="analyze-foot">
      <p class="disclaimer" id="analyze-footnote"></p>
      <div class="analyze-actions">
        <a id="analyze-dl-png" hidden>Download annotated PNG</a>
        <a id="analyze-dl-json" hidden>Download report (JSON)</a>
        <button type="button" id="analyze-globe" hidden>Show on globe</button>
      </div>
    </footer>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <dialog id="shortcuts">
    <h2>KEYBOARD</h2>
    <dl>
      <div><dt>A</dt><dd>Analyze imagery</dd></div>
      <div><dt>K</dt><dd>Kattegat</dd></div>
      <div><dt>Space</dt><dd>Play / pause</dd></div>
      <div><dt>L</dt><dd>Return to live</dd></div>
      <div><dt>F</dt><dd>Fly to selection</dd></div>
      <div><dt>Esc</dt><dd>Clear selection</dd></div>
      <div><dt>?</dt><dd>This sheet</dd></div>
    </dl>
    <form method="dialog"><button type="submit">Close</button></form>
  </dialog>

  <script src="/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.124/Build/Cesium/Cesium.js"></script>
  <script src="/vendor/satellite.min.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
