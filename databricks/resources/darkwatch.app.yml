# App resources and the same command/env as app.yaml.
# Bundle variables are resolved here. They are not resolved inside env `value`
# strings, so catalog/schema literals below match the variable defaults.
resources:
  apps:
    darkwatch:
      name: darkwatch
      description: SAR satellite coverage, Sentinel-1 detections, and public AIS.
      source_code_path: ../..
      config:
        command:
          - python
          - backend/app.py
        env:
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: FISH_AUDIO_API_KEY
            value_from: fish-audio-key
          - name: TIGER_DATABASE_URL
            value_from: tiger-url
          - name: DARKWATCH_CATALOG
            value: workspace
          - name: DARKWATCH_SCHEMA
            value: darkwatch
          # FISH_AUDIO_VOICE_ID and FISH_AUDIO_MODEL fall back to the defaults in
          # backend/darkwatch/config.py. Add them here to override.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: fish-audio-key
          secret:
            scope: darkwatch
            key: fish_audio_api_key
            permission: READ
        - name: tiger-url
          secret:
            scope: darkwatch
            key: tiger_url
            permission: READ
