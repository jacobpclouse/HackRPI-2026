resources:
  jobs:
    darkwatch_refresh:
      name: darkwatch_refresh
      description: Refresh SAR catalog, the newest Kattegat Sentinel-1 scene, Danish AIS, CFAR matches, and pass windows.
      max_concurrent_runs: 1
      timeout_seconds: 7200
      schedule:
        quartz_cron_expression: "0 0 */6 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      environments:
        - environment_key: refresh
          spec:
            environment_version: "4"
            # Must equal backend/constraints.txt for every package in
            # backend/requirements-job.txt. backend/tests/test_pins.py enforces it.
            dependencies:
              - httpx==0.28.1
              - numpy==2.5.4
              - scipy==1.18.1
              - pillow==13.0.0
              - rasterio==1.5.2
              - pyproj==3.8.0
              - shapely==2.2.0
              - sgp4==2.27
              - pyshp==3.1.7
              - "psycopg[binary]==3.3.8"
              - python-dateutil==2.9.0.post0
              - planetary-computer==1.0.0
              - pystac-client==0.9.1
      tasks:
        - task_key: refresh
          environment_key: refresh
          spark_python_task:
            python_file: ../../backend/jobs/refresh.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --repo-root
              - ${workspace.file_path}
