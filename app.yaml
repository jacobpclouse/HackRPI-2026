# Runtime config for `databricks apps deploy` without the bundle. The bundle
# (databricks/resources/nimbus.app.yml) carries the same command and env.
# The CLI schema field is value_from (snake_case); valueFrom is ignored.
command:
  - python
  - backend/app.py

env:
  - name: DATABRICKS_WAREHOUSE_ID
    value_from: sql-warehouse
  - name: FISH_AUDIO_API_KEY
    value_from: fish-audio-key
  - name: TIGER_DATABASE_URL
    value_from: tiger-url
  - name: AISSTREAM_API_KEY
    value_from: aisstream-key
  - name: AIS_GLOBAL_REFRESH
    value: "1"
  - name: NIMBUS_CATALOG
    value: workspace
  - name: NIMBUS_SCHEMA
    value: nimbus
  # FISH_AUDIO_VOICE_ID / FISH_AUDIO_MODEL default in backend/nimbus/config.py.
